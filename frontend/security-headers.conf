# Nginxが自分で応答を作るlocationに付けるセキュリティヘッダー。
# add_headerを持つlocationはserverのadd_headerを引き継がないため、各locationでincludeする。
# alwaysを付け、413・429・404などのエラー応答にも付ける。
# 値を変えたら、scripts/ci/check_docker_smoke.pyのSECURITY_HEADERSも合わせて変える。

# Content-Typeを無視した内容の推測(MIMEスニッフィング)をさせない。
add_header X-Content-Type-Options "nosniff" always;
# 他のサイトのiframeに埋め込ませない(クリックジャッキング対策)。CSPのframe-ancestorsに未対応のブラウザ向け。
add_header X-Frame-Options "DENY" always;
# 外部サイトへ移動するときに、JobLensのURLを送らない。
add_header Referrer-Policy "same-origin" always;
# 読み込めるのは同じオリジンのファイルだけにし、XSSが起きても外部のスクリプトや送信先を使わせない。
# ビルド結果にインラインのscript・styleはないため、'unsafe-inline'は不要。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
