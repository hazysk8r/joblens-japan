upstream joblens_backend {
    zone joblens_backend 64k;

    # 再作成されたバックエンドの IP アドレスを Docker DNS から再取得する。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 既存 API にない本文サイズ制限をプロキシ側で追加しない。
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_intercept_errors off;

    # API の URI とクエリーを変更せず、エラー応答もそのまま転送する。
    location = /api {
        proxy_pass http://joblens_backend;
    }

    location ^~ /api/ {
        proxy_pass http://joblens_backend;
    }

    # 管理用エンドポイントはフロントエンド経由で公開しない。
    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    # この確認は Nginx の応答のみを検証し、API の正常性とは分ける。
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Vite のハッシュ付きファイルだけを長期キャッシュする。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter の画面 URL を直接開いた場合も SPA を返す。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
