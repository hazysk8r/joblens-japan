upstream joblens_backend {
    zone joblens_backend 64k;

    # 再作成されたバックエンドの IP アドレスを Docker DNS から再取得する。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server backend:8080 resolve;
}

# ログイン・会員登録の試行回数を、接続元のIPごとに制限する(パスワードの総当たり・大量登録の対策)。
# X-Forwarded-Forはクライアントが自由に書き換えられるため、TCP接続の相手のアドレスを使う。
# 値を変えたら、scripts/ci/check_docker_smoke.pyの回数も合わせて変える。
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_signup:10m rate=1r/m;

# 429のJSONに入れるpath。$uriをそのまま埋め込むと、"などを含むURIでJSONが壊れるため、
# 決まった値だけを使う。制限をかけるlocationを増やしたら、ここにも追加する。
map $uri $rate_limited_path {
    /api/auth/login  /api/auth/login;
    /api/auth/signup /api/auth/signup;
    default          "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 既存 API にない本文サイズ制限をプロキシ側で追加しない。
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_intercept_errors off;

    # API の URI とクエリーを変更せず、エラー応答もそのまま転送する。
    location = /api {
        proxy_pass http://joblens_backend;
    }

    location ^~ /api/ {
        proxy_pass http://joblens_backend;
    }

    # 完全一致のlocationが優先されるため、制限はログインと会員登録だけにかかる。
    # 許容範囲内の要求は待たせずに処理し(nodelay)、超えた要求はバックエンドに送らず429で拒否する。
    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        # 攻撃を受けたときに、拒否のたびにerrorのログが出て本当のエラーが埋もれないようにする。
        limit_req_log_level warn;
        error_page 429 = @rate_limited;
        proxy_pass http://joblens_backend;
    }

    location = /api/auth/signup {
        limit_req zone=auth_signup burst=3 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @rate_limited;
        proxy_pass http://joblens_backend;
    }

    # 既定のHTMLではなく、APIと同じ形式(ApiErrorResponse)のJSONで返す。
    # HTMLだと画面は本文を読めず、「パスワードが違う」ような汎用の失敗メッセージを出してしまう。
    # Nginxは解除までの残り時間を計算できないため、Retry-Afterは固定値にする。
    location @rate_limited {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"timestamp":"$time_iso8601","status":429,"code":"TOO_MANY_REQUESTS","message":"リクエストが多すぎます。しばらくしてから再度お試しください。","path":"$rate_limited_path","fieldErrors":{}}';
    }

    # 管理用エンドポイントはフロントエンド経由で公開しない。
    location = /actuator {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    # この確認は Nginx の応答のみを検証し、API の正常性とは分ける。
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Vite のハッシュ付きファイルだけを長期キャッシュする。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter の画面 URL を直接開いた場合も SPA を返す。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
