spring:
  application:
    name: joblens-backend

  datasource:
    # 環境変数があればその値を使い、なければコロンの後ろのローカル既定値を使う
    url: ${DB_URL:jdbc:postgresql://localhost:15432/joblens}
    username: ${DB_USERNAME:joblens}
    password: ${DB_PASSWORD:local-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 既定の30秒では、DBの障害時に要求ごとにスレッドを長く占有し、Nginxのタイムアウト(60秒)も超えてしまう。
      connection-timeout: 5000

  jpa:
    hibernate:
      # テーブルの作成はFlywayが担当し、Hibernateは構造が合っているかだけを検証する
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    web:
      pageable:
        # sizeに大きな値を指定されても、1回の一覧取得で返す件数をこの値までに抑える。
        max-page-size: 100

  session:
    jdbc:
      # セッション用テーブルはFlywayのマイグレーションで作成する。
      initialize-schema: never
    servlet:
      # /errorへの転送ではセッションを読まない。DBの障害時に/errorまで失敗し、
      # APIの形式ではなくTomcatのHTMLが返ってしまうため。
      filter-dispatcher-types: async,request

joblens:
  limits:
    # 1ユーザーの保存量の上限(求人は最大で約60KB、メモは最大で約750B)。
    max-postings-per-user: 100
    max-memos-per-posting: 50
    # 応募ステータスの変更履歴。超えると古いものから削除する。
    max-status-histories-per-posting: 100
    # 全体の保存量を抑えるための上限。達すると新規登録だけを止める。
    max-users: 100

server:
  servlet:
    session:
      # Cookieのセキュリティ属性はSessionCookieConfigで設定する。
      timeout: 30m
