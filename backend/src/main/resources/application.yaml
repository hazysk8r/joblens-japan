spring:
  application:
    name: joblens-backend

  datasource:
    # 환경변수가 있으면 그 값을 사용하고, 없으면 콜론 뒤의 로컬 기본값을 사용
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joblens}
    username: ${DB_USERNAME:joblens}
    password: ${DB_PASSWORD:local-password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 테이블 생성은 Flyway가 담당하고, Hibernate는 구조가 맞는지만 검증
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info