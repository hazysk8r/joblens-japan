name: CI

on:
  push:
  pull_request:

permissions:
  contents: read


jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build backend
        run: ./gradlew clean build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint tests
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker Smoke Test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      COMPOSE_PROJECT_NAME: joblens-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_NAME: joblens_ci
      DB_USERNAME: joblens_ci
      DB_PASSWORD: joblens-ci-password
      FRONTEND_PORT: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build images and wait for healthy services
        run: bash scripts/ci/docker-smoke.sh start

      - name: Check frontend and API connections
        run: bash scripts/ci/docker-smoke.sh check

      - name: Collect Docker failure diagnostics
        if: failure()
        run: bash scripts/ci/docker-smoke.sh diagnostics

      - name: Clean up CI Docker resources
        if: always()
        run: bash scripts/ci/docker-smoke.sh cleanup

      - name: Upload Docker failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-smoke
          if-no-files-found: warn
          retention-days: 7
