name: CI

on:
  # PRブランチではpull_requestで実行し、同じコミットの二重実行を避ける。
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRへの連続pushでは古い実行を取り消す。mainの実行は最後まで完了させる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and build backend
        run: ./gradlew clean build

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint tests
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker Smoke Test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      COMPOSE_PROJECT_NAME: joblens-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_NAME: joblens_ci
      DB_USERNAME: joblens_ci
      DB_PASSWORD: joblens-ci-password
      FRONTEND_PORT: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub Actionsキャッシュへビルドレイヤーを保存できるBuildxビルダーを用意する。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Composeのビルドからtype=ghaキャッシュを使えるよう、ランタイム用の環境変数を公開する。
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build images and wait for healthy services
        run: bash scripts/ci/docker-smoke.sh start

      - name: Check frontend and API connections
        run: bash scripts/ci/docker-smoke.sh check

      - name: Collect Docker failure diagnostics
        if: failure()
        run: bash scripts/ci/docker-smoke.sh diagnostics

      - name: Clean up CI Docker resources
        if: always()
        run: bash scripts/ci/docker-smoke.sh cleanup

      - name: Upload Docker failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-smoke
          if-no-files-found: warn
          retention-days: 7
