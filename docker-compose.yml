services:
  postgres:
    image: postgres:16
    container_name: joblens-postgres
    environment:
      POSTGRES_DB: joblens
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: local-password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - joblens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joblens -d joblens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  joblens-postgres-data: