services:
  postgres:
    image: postgres:16
    container_name: joblens-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-joblens}
      POSTGRES_USER: ${DB_USERNAME:-joblens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - joblens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-joblens}
      DB_USERNAME: ${DB_USERNAME:-joblens}
      DB_PASSWORD: ${DB_PASSWORD:-local-password}
      # このComposeはHTTPのローカル環境用のため、セッションCookieのSecureを外す。
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  joblens-postgres-data:
